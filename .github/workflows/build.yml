name: Crear APK firmado de ALMA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar app, plugins nativos y puente seguro
        run: |
          set -euo pipefail
          npm init -y
          npm install --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/local-notifications@6 \
            @capacitor-community/speech-recognition@6 \
            @capacitor-community/text-to-speech@6 \
            capacitor-secure-storage-plugin@0.10.0 \
            esbuild tailwindcss@3
          cat > tailwind.config.js <<-'EOF'
          module.exports = { darkMode: 'class', content: ['./index.html'], theme: { extend: { boxShadow: { soft: '0 8px 24px -6px rgba(15,23,42,0.05)', card: '0 4px 16px -2px rgba(15,23,42,0.04)', orb: '0 12px 32px -4px rgba(79,70,229,0.45)' } } } }
          EOF
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > in.css
          mkdir -p www
          cp index.html www/index.html
          npx tailwindcss -i in.css -o www/tw.css --minify
          cat > secure-storage-bridge.js <<'EOF'
          import { SecureStoragePlugin } from 'capacitor-secure-storage-plugin';
          window.__nativePlugins = Object.assign(window.__nativePlugins || {}, { SecureStoragePlugin });
          EOF
          npx esbuild secure-storage-bridge.js --bundle --format=iife --outfile=www/secure-storage.js
          sed -i 's/VERSION_21/VERSION_17/g' node_modules/@capacitor-community/*/android/build.gradle || true
          npx cap init "ALMA" "com.miasistente.app" --web-dir=www
          npx cap add android
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application|' "$MANIFEST"
          sed -i "s/versionCode 1/versionCode $((1000 + GITHUB_RUN_NUMBER))/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${GITHUB_RUN_NUMBER}\"/" android/app/build.gradle



      - name: Compilar APK release firmado
        env:
          ALMA_SIGNING_STORE_PASSWORD: ${{ secrets.ALMA_SIGNING_STORE_PASSWORD }}
          ALMA_SIGNING_KEY_ALIAS: ${{ secrets.ALMA_SIGNING_KEY_ALIAS }}
          ALMA_SIGNING_KEY_PASSWORD: ${{ secrets.ALMA_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ALMA-APK-firmado
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
