name: Crear APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar archivos
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar app, plugins nativos y compilar APK
        run: |
          mkdir -p www
          cp *.html www/ 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp *.js www/ 2>/dev/null || true
          if [ ! -f www/tw.css ]; then
            sed -i 's|<link rel="stylesheet" href="tw.css">|<script src="https://cdn.tailwindcss.com"></script>|g' www/index.html
          fi
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Mi Asistente" "com.miasistente.app" --web-dir=www
          npx cap add android
          npm install --legacy-peer-deps \
            @capacitor/local-notifications@6 \
            @capacitor-community/speech-recognition@6 \
            @capacitor-community/text-to-speech@6
          npx cap sync android
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$MANIFEST"
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Asistente-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

